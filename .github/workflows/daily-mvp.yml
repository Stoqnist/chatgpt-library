name: Private daily MVP checks
on:
  pull_request:
    paths: ['daily/**', 'demo/nginx.conf', '.github/workflows/daily-mvp.yml']
permissions:
  contents: read
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s daily/tests -v
      - run: node --check daily/static/app.js
      - run: node --check daily/static/morning.js
      - run: node --check daily/static/chat.js
      - run: node --test daily/tests/test_*.cjs
      - name: Browser acceptance with synthetic conversation
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -x "$CHROME_PATH"
          node daily/tests/browser_conversation.mjs
      - run: docker build -t agency-daily:local daily
      - name: Check real production server and unauthenticated boundary
        run: |
          mkdir -p /tmp/daily-ci/data
          sudo chown 10001:10001 /tmp/daily-ci/data
          login_hash=$(PYTHONPATH=daily python3 -c "from app import password_hash; print(password_hash('ci-disposable-not-a-real-secret'))")
          printf 'AGENCY_ORIGIN=https://example.invalid\nAGENCY_LOGIN_HASH=%s\n' "$login_hash" > /tmp/daily-ci/runtime.env
          docker network create agency-daily-check-net
          AGENCY_PRIVATE_DIR=/tmp/daily-ci AGENCY_NETWORK=agency-daily-check-net docker compose -p agency-daily-check -f daily/compose.yaml up -d --no-build --wait --wait-timeout 60
          for n in $(seq 1 20); do curl -fsS http://127.0.0.1:18001/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:18001/daily/ > /tmp/daily.html
          cmp daily/static/index.html /tmp/daily.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18001/daily/chat)" = 303
          curl -sS -D /tmp/chat-headers -o /dev/null http://127.0.0.1:18001/daily/chat
          grep -qi 'Location: /daily/#conversation' /tmp/chat-headers
          grep -q 'id="conversation"' /tmp/daily.html
          curl -fsS http://127.0.0.1:18001/daily/chat.js > /tmp/daily-chat.js
          cmp daily/static/chat.js /tmp/daily-chat.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18001/daily/api/chat/export)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18001/daily/api/state)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18001/daily/../../app.py)" != 200
      - if: always()
        run: AGENCY_PRIVATE_DIR=/tmp/daily-ci AGENCY_NETWORK=agency-daily-check-net docker compose -p agency-daily-check -f daily/compose.yaml down || true
