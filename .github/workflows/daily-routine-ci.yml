name: V2 Daily Routine MVP Offline Checks
on:
  pull_request:
    paths:
      - "mvp/daily-routine/**"
      - ".github/workflows/daily-routine-ci.yml"
  push:
    branches: [main]
    paths:
      - "mvp/daily-routine/**"
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r mvp/daily-routine/requirements.txt
      - name: Offline tests
        working-directory: mvp/daily-routine
        run: python -m unittest discover -v
      - name: Compile
        run: python -m py_compile mvp/daily-routine/app.py
      - name: No embedded secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [p for p in Path('mvp/daily-routine').rglob('*') if p.is_file()]
          assert all('sk-proj-' not in p.read_text(errors='ignore') for p in files)
          PY
