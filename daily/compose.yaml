name: agency-daily
services:
  daily:
    build: .
    image: agency-daily:local
    env_file: /opt/agency-daily/private/runtime.env
    volumes:
      - /opt/agency-daily/private/data:/data
    environment:
      AGENCY_DATA_DIR: /data
    ports:
      - "127.0.0.1:18001:8000"
    networks:
      default:
        aliases: [agency-daily]
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
networks:
  default:
    external: true
    name: stoq-infrastructure_default
