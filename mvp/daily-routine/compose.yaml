name: agency-daily-v2
services:
  daily:
    build:
      context: ../..
      dockerfile: mvp/daily-routine/Dockerfile
    image: agency-daily-v2:local
    env_file:
      - ./private.env
    ports:
      - "127.0.0.1:18080:18080"
    read_only: true
    init: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.75
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/_internal/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
