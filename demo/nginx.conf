pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache always;
    location = / { try_files /index.html =404; }
    location ~ ^/(index\.html|style\.css|journey\.css|brand-journey\.css|app\.js|cases\.js)$ { try_files $uri =404; }
    location ~ ^/assets/(stoqnist-banner|stoqnist-banner-mobile)\.svg$ { try_files $uri =404; }
    location ~ ^/assets/(everyday-room|stoqnist-family-hero|stoqnist-family-mobile)\.webp$ { try_files $uri =404; }
    location / { return 404; }
  }
}
